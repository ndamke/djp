name: Build and deploy Hugo to webserver

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Go einrichten
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Systempakete installieren
        run: |
          sudo apt-get update
          sudo apt-get install -y rsync openssh-client

      - name: Hugo installieren
        run: |
          go install -tags extended github.com/gohugoio/hugo@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH

      - name: Hugo-Version prüfen
        run: hugo version

      - name: SSH vorbereiten
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf "%s\n" "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Hugo bauen
        run: |
          rm -rf public
          hugo build --gc --minify

      - name: Auf den Server deployen
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ secrets.DEPLOY_PATH }}
        run: |
          rsync -avz --delete \
            -e "ssh -p $SSH_PORT -i ~/.ssh/id_ed25519" \
            public/ "${SSH_USER}@${SSH_HOST}:${DEPLOY_PATH}"
